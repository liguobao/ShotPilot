name: Build Release Binaries

on:
  push:
    tags:
      - "*"

jobs:
  build:
    name: Build ${{ matrix.display }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            display: macOS
            label: macos
          - os: windows-latest
            display: Windows
            label: windows

    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG:-}" ]]; then
            echo "Release tag missing" >&2
            exit 1
          fi
          clean="${RELEASE_TAG#v}"
          {
            echo "raw=${RELEASE_TAG}"
            echo "version=${clean}"
          } >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend assets
        run: npm run build
        working-directory: frontend

      - name: Build macOS executable
        if: matrix.os == 'macos-latest'
        shell: bash
        run: bash backend/build.sh -v "${{ steps.version.outputs.version }}"

      - name: Build Windows executable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: backend/build.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Locate build artifact
        id: artifact
        shell: python
        run: |
          import os
          from pathlib import Path

          dist_dir = Path("backend/dist")
          candidates = sorted(dist_dir.glob("ScreenCapture_*"), key=lambda p: p.stat().st_mtime, reverse=True)
          if not candidates:
            raise SystemExit("::error::No build artifact found in backend/dist")

          chosen = candidates[0].resolve()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"path={chosen}\n")
            fh.write(f"name={chosen.name}\n")

      - name: Prepare release asset
        id: asset
        shell: python
        env:
          SRC_PATH: ${{ steps.artifact.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          import os
          import shutil
          from pathlib import Path

          src = Path(os.environ["SRC_PATH"])
          dest = Path(f"ShotPilot-{os.environ['VERSION']}-{os.environ['LABEL']}{src.suffix}")
          shutil.copy2(src, dest)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"file={dest}\n")

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.asset.outputs.file }}
          tag_name: ${{ steps.version.outputs.raw }}
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
